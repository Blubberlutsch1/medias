<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Qualified Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; }
    button { padding: 14px 22px; font-size: 16px; margin: 8px 8px 8px 0; cursor: pointer; }
    #status { margin-top: 24px; padding: 12px; background: #f2f2f2; font-family: monospace; white-space: pre-wrap; }
  </style>

  <!-- Qualified: Stub, damit qualified(...) schon vor dem Laden aufrufbar ist -->
  <script>
    (function (w, q) {
      w['QualifiedObject'] = q;
      w[q] = w[q] || function () { (w[q].q = w[q].q || []).push(arguments); };
    })(window, 'qualified');
  </script>
  <script async src="https://js.qualified.com/qualified.js?token=ED5vfALhKZynK8HR"></script>
</head>
<body>
  <h1>Qualified Test</h1>
  <p>Einfache Seite ohne Kopie, ohne Cookie-Banner.</p>

  <button id="btn-attr" data-qualified="chat" type="button">Button 1: data-qualified="chat"</button>
  <button id="btn-js" type="button" onclick="qualified('open_chat')">Button 2: qualified('open_chat')</button>

  <div id="status">Prüfe ...</div>

  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.getElementById('status').textContent =
          'Seite: ' + location.href + '\n' +
          'typeof window.qualified: ' + typeof window.qualified + '\n' +
          'Qualified-Script-Tag: ' + !!document.querySelector('script[src*="qualified.js"]');
      }, 1500);
    });
  </script>
</body>
</html>
